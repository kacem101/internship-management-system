spring:
  application:
    name: enscs-internship

  datasource:
    url: jdbc:postgresql://localhost:5432/enscs_internship
    username: ${DB_USERNAME:enscs_user}
    password: ${DB_PASSWORD:2006}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # SPRINT 2 — enable @Scheduled and @Async
  task:
    scheduling:
      pool:
        size: 2
    execution:
      pool:
        core-size: 4
        max-size: 8

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  # SPRINT 1 — global report deadline fallback (days after internship end date)
  report:
    deadline-days: ${REPORT_DEADLINE_DAYS:14}

  # SPRINT 1 — withdrawal cutoff (days before internship start date)
  withdrawal:
    cutoff-days: ${WITHDRAWAL_CUTOFF_DAYS:7}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
